# Dependabot: weekly version updates, grouped, plus grouped security updates.
# Security updates themselves are switched on in the repo settings
# (Settings > Code security > Dependabot security updates); this file only shapes the PRs.
# Patch-only PRs are merged automatically by .github/workflows/dependabot-auto-merge.yml
# once CI passes; minor and major PRs wait for review.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      npm-patch-minor:
        applies-to: version-updates
        update-types: [patch, minor]
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Stay on the Next.js 15.5.x line.
      - dependency-name: next
        versions: [">=16.0.0"]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
